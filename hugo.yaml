baseURL: "https://ignatiusmaldive-a11y.github.io/benet-corner-site/"
title: "Benet Corner · Wiki oberta"
languageCode: "ca"
defaultContentLanguage: "ca"
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: Projecte
      pageRef: /docs
      weight: 1
    - name: Finançament
      pageRef: /docs/financament
      weight: 2
    - name: Documents
      pageRef: /docs/documents
      weight: 3
    - name: Participa
      pageRef: /docs/participacio
      weight: 4
    - name: Transparència
      pageRef: /docs/transparencia
      weight: 5
    - name: Cerca
      weight: 6
      params:
        type: search
    - name: GitHub
      url: "https://github.com/ignatiusmaldive-a11y/benet-corner-site"
      weight: 7
      params:
        icon: github

params:
  description: "Wiki pública del projecte comunitari, climàtic i patrimonial Benet Corner, al Rec Comtal 19B de Barcelona."
  externalLinkDecoration: true
  theme:
    default: light
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: wide
  footer:
    displayCopyright: true
    displayPoweredBy: false
  displayUpdatedDate: true
  dateFormat: "2 January 2006"
  editURL:
    enable: true
    base: "https://github.com/ignatiusmaldive-a11y/benet-corner-site/edit/main/content"

languages:
  ca:
    languageName: Català
    weight: 1
    title: "Benet Corner · Wiki oberta"
    params:
      description: "Informació pública, documents i seguiment del projecte Benet Corner."

copyright: "© 2026 Benet Corner · Contingut informatiu subjecte a revisió i actualització."
